<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0D0D0D">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Xtream IPTV</title>
    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ══════════════════════════════════════════════ -->
    <!-- LOGIN SCREEN                                    -->
    <!-- ══════════════════════════════════════════════ -->
    <div id="loginScreen" class="screen active">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">▶</div>
                <h1>Xtream IPTV</h1>
                <p class="subtitle">Connectez-vous à votre serveur</p>
            </div>
            <form id="loginForm" autocomplete="off">
                <div class="input-group">
                    <label for="serverUrl">URL du serveur</label>
                    <input type="url" id="serverUrl" placeholder="http://votreserveur.com:8080" required>
                </div>
                <div class="input-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" placeholder="Votre identifiant" required>
                </div>
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" placeholder="Votre mot de passe" required>
                </div>
                <div id="loginError" class="error-msg hidden"></div>
                <button type="submit" id="loginBtn" class="btn-primary">
                    <span id="loginBtnText">Connexion</span>
                    <span id="loginSpinner" class="spinner hidden"></span>
                </button>
            </form>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════ -->
    <!-- MAIN SCREEN (after login)                      -->
    <!-- ══════════════════════════════════════════════ -->
    <div id="mainScreen" class="screen">

        <!-- Top Bar -->
        <header id="topBar">
            <button id="menuToggle" class="icon-btn" aria-label="Menu">
                <span class="hamburger"></span>
            </button>
            <h2 id="pageTitle">Live TV</h2>
            <button id="logoutBtn" class="icon-btn" aria-label="Déconnexion" title="Déconnexion">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
        </header>

        <div class="main-layout">

            <!-- Sidebar / Navigation -->
            <nav id="sideNav">
                <div class="nav-header">
                    <span class="nav-logo">▶</span>
                    <span class="nav-title">Xtream IPTV</span>
                </div>
                <ul class="nav-list">
                    <li class="nav-item active" data-tab="live">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
                        <span>Live TV</span>
                    </li>
                    <li class="nav-item" data-tab="vod">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="2" y1="17" x2="7" y2="17"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
                        <span>Films</span>
                    </li>
                    <li class="nav-item" data-tab="series">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4.25 12 4 12 4s-6.88-.25-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.94 2c1.72.71 8.6.46 8.6.46s6.88.25 8.6-.46a2.78 2.78 0 0 0 1.94-2A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 8.75 15.5 12 9.75 15.25 9.75 8.75"/></svg>
                        <span>Séries</span>
                    </li>
                </ul>
                <div class="nav-footer">
                    <div class="user-badge" id="userBadge"></div>
                </div>
            </nav>

            <!-- Content Area -->
            <main id="contentArea">

                <!-- Loading overlay -->
                <div id="loadingOverlay" class="loading-overlay hidden">
                    <div class="spinner large"></div>
                </div>

                <!-- Categories row -->
                <div id="categoriesRow" class="categories-row">
                    <button class="chip active" data-id="">Tous</button>
                </div>

                <!-- Scrollable content grid -->
                <div id="contentGrid" class="content-grid">
                    <!-- Cards injected here -->
                </div>

            </main>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════ -->
    <!-- PLAYER OVERLAY (launch external / internal)    -->
    <!-- ══════════════════════════════════════════════ -->
    <div id="playerOverlay" class="player-overlay hidden">
        <div class="player-card">
            <div class="player-info">
                <h3 id="playerTitle">Titre</h3>
                <p id="playerUrl" class="player-url"><a id="playerUrlLink" href="#" target="_blank"></a></p>
            </div>
            <div class="player-actions">
                <a id="playVlcBtn" href="#" class="btn-primary play-btn" target="_blank">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Ouvrir dans VLC
                </a>
                <button id="playBrowserBtn" class="btn-secondary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                    Lire dans le navigateur
                </button>
                <button id="playM3uBtn" class="btn-outline">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    Télécharger .m3u (VLC)
                </button>
                <button id="copyUrlBtn" class="btn-outline">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                    Copier l'URL
                </button>
                <button id="closePlayerBtn" class="btn-outline close-btn">Fermer</button>
            </div>
        </div>
    </div>

    <!-- Mobile bottom nav (only visible on small screens) -->
    <nav id="bottomNav" class="bottom-nav">
        <button class="bottom-nav-item active" data-tab="live">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
            <span>Live</span>
        </button>
        <button class="bottom-nav-item" data-tab="vod">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"/><line x1="7" y1="2" x2="7" y2="22"/><line x1="17" y1="2" x2="17" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="2" y1="7" x2="7" y2="7"/><line x1="17" y1="17" x2="22" y2="17"/><line x1="17" y1="7" x2="22" y2="7"/></svg>
            <span>Films</span>
        </button>
        <button class="bottom-nav-item" data-tab="series">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4.25 12 4 12 4s-6.88-.25-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 12a29 29 0 0 0 .46 5.58 2.78 2.78 0 0 0 1.94 2c1.72.71 8.6.46 8.6.46s6.88.25 8.6-.46a2.78 2.78 0 0 0 1.94-2A29 29 0 0 0 23 12a29 29 0 0 0-.46-5.58z"/><polygon points="9.75 8.75 15.5 12 9.75 15.25 9.75 8.75"/></svg>
            <span>Séries</span>
        </button>
    </nav>

    <script src="js/app.js?v=2"></script>
</body>
</html>
